name: Publish Docker Image

on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:
    branches:
      - main
      - 'release-*'
      # Phase branches PR into their feature branch, not into a train. Without
      # this those PRs run no checks at all — #107 merged the entire Postgres
      # dialect layer with zero CI because of it.
      - 'feat/**'

jobs:
  # Deliberately a separate job rather than a step in `test`: `build` gates on
  # `test`, so a formatting slip in a shared job would skip the image publish
  # and leave :latest silently stale over something purely cosmetic.
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Corepack must be enabled before setup-node so its pnpm cache resolver can
      # find the version pinned in package.json's packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fix locally with `pnpm format`.
      - name: Check formatting
        run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # The suite runs against both dialects. Postgres is not optional here: the
    # schema/driver seam in db/index.ts is asserted with a cast, so this matrix
    # is the only thing verifying the two schemas have not drifted apart.
    # Port matches docker-compose.test.yml so DATABASE_URL is identical locally.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tally -d tally_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Corepack must be enabled before setup-node so its pnpm cache resolver can
      # find the version pinned in package.json's packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `build` job compiles the backend, but its tsconfig excludes the test
      # files so they stay out of the published image — which left them checked
      # by nothing at all. This covers them. It runs first because a type error
      # is cheaper to read than the test failure it would surface as.
      - name: Typecheck backend (including tests)
        run: pnpm -C backend typecheck

      - name: Run backend tests (SQLite)
        run: pnpm -C backend test

      - name: Run backend tests (Postgres)
        run: pnpm -C backend test:pg

      # A step in this job rather than a job of its own, so the required-check
      # list in branch protection stays as it is. The Postgres service above is
      # irrelevant here and simply goes unused.
      - name: Run frontend tests
        run: pnpm -C web test

  # Its own job: it boots real servers against a real Postgres and is slower and
  # noisier than the unit matrix, so it should not sit in front of it. It uses
  # the same postgres:17 service on the same port, so DATABASE_URL is identical
  # to a local run.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tally -d tally_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `test:e2e` builds the backend first on purpose. These tests run
      # `backend/dist`, and a stale dist is exactly the failure mode that once
      # let a broken build look healthy.
      - name: Run end-to-end scenarios
        run: pnpm test:e2e

  build:
    runs-on: ubuntu-latest
    needs: test
    # Escape hatch for landing work without cutting a new image: put
    # [skip image] in the merge commit message. Spelled to match GitHub's own
    # markers, but it is ours — GitHub's suppress the entire workflow, tests
    # included, whereas this suppresses only the publish. `head_commit` is
    # null on pull_request events, so PR builds are unaffected.
    if: ${{ !contains(github.event.head_commit.message, '[skip image]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest is the released image and must only ever come from main.
      # Release trains publish :next instead, so the train can be dogfooded
      # without shipping unreleased code to everyone running :latest.
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "value=latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/lukanrocks/tally:${{ steps.tag.outputs.value }}
